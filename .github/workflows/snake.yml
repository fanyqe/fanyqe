name: Generate contribution animation

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark contribution animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2355E6C1&color_dots=%23EBEDF0,%23B7F7E7,%2355E6C1,%231AA179,%230B614D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFB454&color_dots=%23161B22,%230D3B36,%2316655A,%232C9B83,%2355E6C1

      - name: Publish animation branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
