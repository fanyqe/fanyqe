<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">From idea to production</title>
  <desc id="desc">An animated five-stage product delivery pipeline</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D12" />
      <stop offset="1" stop-color="#111A23" />
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6C1" />
      <stop offset="0.7" stop-color="#55E6C1" />
      <stop offset="1" stop-color="#FFB454" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22303D" stroke-width="1" opacity="0.28" />
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)" />
  <rect width="1200" height="300" rx="22" fill="url(#grid)" />
  <rect x="24" y="24" width="1152" height="252" rx="16" fill="#0E141B" fill-opacity="0.86" stroke="#2B3947" />

  <text x="58" y="65" fill="#55E6C1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">DELIVERY PIPELINE</text>
  <text x="1142" y="65" text-anchor="end" fill="#708090" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">status: observable / rollback-ready</text>

  <line x1="120" y1="144" x2="1040" y2="144" stroke="#263746" stroke-width="5" stroke-linecap="round" />
  <line x1="120" y1="144" x2="1040" y2="144" stroke="url(#track)" stroke-width="2" stroke-linecap="round" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(120 144)">
      <circle r="17" fill="#101A22" stroke="#55E6C1" stroke-width="2" />
      <circle r="5" fill="#55E6C1" />
      <text y="-34" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">IDEA</text>
      <text y="48" text-anchor="middle" fill="#7E8D9C" font-size="12">find the real problem</text>
    </g>
    <g transform="translate(350 144)">
      <circle r="17" fill="#101A22" stroke="#55E6C1" stroke-width="2" />
      <circle r="5" fill="#55E6C1" />
      <text y="-34" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">CONTRACT</text>
      <text y="48" text-anchor="middle" fill="#7E8D9C" font-size="12">remove ambiguity</text>
    </g>
    <g transform="translate(580 144)">
      <circle r="17" fill="#101A22" stroke="#55E6C1" stroke-width="2" />
      <circle r="5" fill="#55E6C1" />
      <text y="-34" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">BUILD</text>
      <text y="48" text-anchor="middle" fill="#7E8D9C" font-size="12">small reversible steps</text>
    </g>
    <g transform="translate(810 144)">
      <circle r="17" fill="#101A22" stroke="#55E6C1" stroke-width="2" />
      <circle r="5" fill="#55E6C1" />
      <text y="-34" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">VERIFY</text>
      <text y="48" text-anchor="middle" fill="#7E8D9C" font-size="12">tests &gt; optimism</text>
    </g>
    <g transform="translate(1040 144)">
      <circle r="20" fill="#101A22" stroke="#FFB454" stroke-width="2" />
      <circle r="6" fill="#FFB454">
        <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text y="-34" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">SHIP</text>
      <text y="48" text-anchor="middle" fill="#7E8D9C" font-size="12">monitor the outcome</text>
    </g>
  </g>

  <circle cx="120" cy="144" r="13" fill="#55E6C1" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="120;350;580;810;1040" keyTimes="0;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="120" cy="144" r="4" fill="#E6EDF3">
    <animate attributeName="cx" values="120;350;580;810;1040" keyTimes="0;0.25;0.5;0.75;1" dur="7s" repeatCount="indefinite" />
  </circle>

  <text x="600" y="246" text-anchor="middle" fill="#5F7080" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">no production deploys powered by vibes</text>
</svg>
