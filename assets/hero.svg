<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">fanyqe — product-minded engineer</title>
  <desc id="desc">Animated terminal-inspired banner in cyan and amber</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10" />
      <stop offset="0.55" stop-color="#0B1118" />
      <stop offset="1" stop-color="#101820" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6C1" />
      <stop offset="0.55" stop-color="#55E6C1" />
      <stop offset="1" stop-color="#FFB454" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55E6C1" stop-opacity="0.22" />
      <stop offset="1" stop-color="#55E6C1" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#22303D" stroke-width="1" opacity="0.34" />
    </pattern>
    <clipPath id="panelClip">
      <rect x="26" y="26" width="1148" height="288" rx="18" />
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)" />
  <rect width="1200" height="340" rx="24" fill="url(#grid)" />
  <circle cx="1020" cy="86" r="260" fill="url(#glow)">
    <animate attributeName="r" values="235;275;235" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite" />
  </circle>

  <g clip-path="url(#panelClip)">
    <rect x="26" y="26" width="1148" height="288" rx="18" fill="#0E141B" fill-opacity="0.84" stroke="#2B3947" />
    <rect x="26" y="26" width="1148" height="46" fill="#111923" />
    <circle cx="54" cy="49" r="6" fill="#FF6B6B" />
    <circle cx="76" cy="49" r="6" fill="#FFB454" />
    <circle cx="98" cy="49" r="6" fill="#55E6C1" />
    <text x="126" y="55" fill="#6E7E8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/workspace/profile</text>

    <rect x="-260" y="72" width="220" height="242" fill="#55E6C1" opacity="0.035" transform="skewX(-18)">
      <animate attributeName="x" from="-320" to="1350" dur="6s" repeatCount="indefinite" />
    </rect>

    <text x="76" y="128" fill="#55E6C1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">PRODUCT-MINDED ENGINEER</text>
    <text x="72" y="218" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="82" font-weight="700" letter-spacing="-5">fanyqe</text>
    <rect x="74" y="238" width="370" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="90;370;370;90" keyTimes="0;0.25;0.8;1" dur="7s" repeatCount="indefinite" />
    </rect>
    <text x="76" y="280" fill="#8B99A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">&gt; craft(web, mobile, automation);</text>
    <rect x="452" y="263" width="10" height="22" rx="1" fill="#FFB454">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" />
    </rect>

    <g transform="translate(900 164)">
      <circle r="72" fill="none" stroke="#22303D" stroke-width="1" />
      <circle r="48" fill="none" stroke="#22303D" stroke-width="1" stroke-dasharray="3 8" />
      <circle r="18" fill="#55E6C1" opacity="0.14" filter="url(#softGlow)" />
      <circle r="7" fill="#55E6C1" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
        <circle cx="72" cy="0" r="6" fill="#FFB454" />
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite" />
        <circle cx="48" cy="0" r="4" fill="#55E6C1" />
      </g>
    </g>
  </g>
</svg>
