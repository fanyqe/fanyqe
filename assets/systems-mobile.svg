<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title desc">
  <title id="title">Production systems thinking</title>
  <desc id="desc">A mobile animated flow from clients to observability</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10" />
      <stop offset="1" stop-color="#111A23" />
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55E6C1" />
      <stop offset="1" stop-color="#FFB454" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22303D" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>

  <rect width="600" height="830" rx="24" fill="url(#bg)" />
  <rect width="600" height="830" rx="24" fill="url(#grid)" />
  <rect x="22" y="22" width="556" height="786" rx="18" fill="#0E141B" fill-opacity="0.88" stroke="#2B3947" />

  <text x="52" y="66" fill="#55E6C1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">SYSTEM MAP</text>
  <text x="548" y="66" text-anchor="end" fill="#708090" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">observable</text>

  <line x1="78" y1="145" x2="78" y2="677" stroke="#2D4252" stroke-width="5" stroke-linecap="round" />
  <line x1="78" y1="145" x2="78" y2="677" stroke="url(#flow)" stroke-width="2" stroke-linecap="round" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(114 102)">
      <rect width="400" height="86" rx="13" fill="#111B24" stroke="#2B6570" />
      <text x="24" y="34" fill="#E6EDF3" font-size="17" font-weight="700">CLIENTS</text>
      <text x="24" y="59" fill="#55E6C1" font-size="13">web · mobile · clear UX</text>
    </g>
    <g transform="translate(114 235)">
      <rect width="400" height="86" rx="13" fill="#111B24" stroke="#2B6570" />
      <text x="24" y="34" fill="#E6EDF3" font-size="17" font-weight="700">EDGE</text>
      <text x="24" y="59" fill="#55E6C1" font-size="13">auth · limits · trust boundaries</text>
    </g>
    <g transform="translate(114 368)">
      <rect width="400" height="86" rx="13" fill="#111B24" stroke="#3C756F" />
      <text x="24" y="34" fill="#E6EDF3" font-size="17" font-weight="700">SERVICES</text>
      <text x="24" y="59" fill="#55E6C1" font-size="13">domain · jobs · business rules</text>
    </g>
    <g transform="translate(114 501)">
      <rect width="400" height="86" rx="13" fill="#111B24" stroke="#8A6840" />
      <text x="24" y="34" fill="#E6EDF3" font-size="17" font-weight="700">DATA</text>
      <text x="24" y="59" fill="#FFB454" font-size="13">db · cache · consistent state</text>
    </g>
    <g transform="translate(114 634)">
      <rect width="400" height="86" rx="13" fill="#111B24" stroke="#8A6840" />
      <text x="24" y="34" fill="#E6EDF3" font-size="17" font-weight="700">SIGNALS</text>
      <text x="24" y="59" fill="#FFB454" font-size="13">logs · metrics · know the outcome</text>
    </g>
  </g>

  <circle cx="78" cy="145" r="5" fill="#E6EDF3">
    <animate attributeName="cy" values="145;278;411;544;677" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite" />
  </circle>

  <text x="300" y="774" text-anchor="middle" fill="#5F7080" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">failure paths deserve first-class design</text>
</svg>
