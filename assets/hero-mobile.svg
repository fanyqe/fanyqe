<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-labelledby="title desc">
  <title id="title">fanyqe — product-minded engineer</title>
  <desc id="desc">Mobile terminal-inspired banner in cyan and amber</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B10" />
      <stop offset="1" stop-color="#101820" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6C1" />
      <stop offset="1" stop-color="#FFB454" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22303D" stroke-width="1" opacity="0.34" />
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#55E6C1" stop-opacity="0.2" />
      <stop offset="1" stop-color="#55E6C1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="420" rx="24" fill="url(#bg)" />
  <rect width="600" height="420" rx="24" fill="url(#grid)" />
  <circle cx="486" cy="320" r="180" fill="url(#glow)">
    <animate attributeName="r" values="165;190;165" dur="8s" repeatCount="indefinite" />
  </circle>

  <rect x="22" y="22" width="556" height="376" rx="18" fill="#0E141B" fill-opacity="0.88" stroke="#2B3947" />
  <rect x="22" y="22" width="556" height="48" rx="18" fill="#111923" />
  <rect x="22" y="52" width="556" height="18" fill="#111923" />
  <circle cx="50" cy="46" r="6" fill="#FF6B6B" />
  <circle cx="72" cy="46" r="6" fill="#FFB454" />
  <circle cx="94" cy="46" r="6" fill="#55E6C1" />
  <text x="122" y="52" fill="#6E7E8F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">~/profile</text>

  <text x="52" y="122" fill="#55E6C1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2">PRODUCT-MINDED ENGINEER</text>
  <text x="48" y="208" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="78" font-weight="700" letter-spacing="-5">fanyqe</text>
  <rect x="51" y="230" width="330" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="90;330;330;90" keyTimes="0;0.25;0.8;1" dur="7s" repeatCount="indefinite" />
  </rect>
  <text x="52" y="270" fill="#8B99A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">&gt; craft(web, mobile, automation);</text>
  <rect x="428" y="253" width="10" height="22" rx="1" fill="#FFB454">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(472 326)">
    <circle r="48" fill="none" stroke="#2B3947" />
    <circle r="28" fill="none" stroke="#2B3947" stroke-dasharray="3 7" />
    <circle r="6" fill="#55E6C1" />
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite" />
      <circle cx="48" r="5" fill="#FFB454" />
    </g>
  </g>
</svg>
